[build]
  publish = "static"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://wyuyzqlbmjcxmagrdbru.supabase.co; img-src 'self' data: https://wyuyzqlbmjcxmagrdbru.supabase.co; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src https://fonts.gstatic.com; script-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
